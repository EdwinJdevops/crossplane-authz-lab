apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpal-verifier-isolation
  namespace: cpal-experiment
spec:
  podSelector:
    matchLabels:
      app: cpal-verifier
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cpal-collector
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpal-collector-isolation
  namespace: cpal-experiment
spec:
  podSelector:
    matchLabels:
      app: cpal-collector
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cpal-verifier
      ports:
        - protocol: TCP
          port: 8443
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
