apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpal-verifier
  namespace: cpal-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cpal-verifier
  template:
    metadata:
      labels:
        app: cpal-verifier
    spec:
      serviceAccountName: cpal-token-verifier
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: python:3.12-slim
          command: [python, /opt/cpal/scripts/run_verifier.py]
          ports:
            - containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PYTHONPATH
              value: /opt/cpal/src
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: CPAL_OBSERVATION_POD
              value: cpal-target
            - name: CPAL_NAMESPACE
              value: cpal-experiment
            - name: CPAL_COLLECTOR_SERVICE_ACCOUNT
              value: cpal-collector
            - name: CPAL_COLLECTOR_UID
              valueFrom:
                configMapKeyRef:
                  name: cpal-verifier-runtime
                  key: collector_uid
            - name: CPAL_KUBERNETES_URL
              value: https://kubernetes.default.svc
            - name: CPAL_KUBERNETES_CA
              value: /etc/cpal/kube-ca/ca.crt
            - name: CPAL_VERIFIER_TOKEN_PATH
              value: /etc/cpal/token/token
            - name: CPAL_TLS_CERT
              value: /etc/cpal/tls/tls.crt
            - name: CPAL_TLS_KEY
              value: /etc/cpal/tls/tls.key
            - name: CPAL_CHALLENGE_DB
              value: /tmp/challenges.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /opt/cpal
              readOnly: true
            - name: verifier-token
              mountPath: /etc/cpal/token
              readOnly: true
            - name: kube-ca
              mountPath: /etc/cpal/kube-ca
              readOnly: true
            - name: tls
              mountPath: /etc/cpal/tls
              readOnly: true
            - name: state
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: cpal-verifier-code
            items:
              - {key: run_verifier.py, path: scripts/run_verifier.py}
              - {key: report_tls.py, path: src/cpal/report_tls.py}
              - {key: report_http.py, path: src/cpal/report_http.py}
              - {key: report_handler.py, path: src/cpal/report_handler.py}
              - {key: independent_pod_observation.py, path: src/cpal/independent_pod_observation.py}
              - {key: report_protocol.py, path: src/cpal/report_protocol.py}
              - {key: challenge_issuer.py, path: src/cpal/challenge_issuer.py}
              - {key: challenge_store.py, path: src/cpal/challenge_store.py}
              - {key: challenge_verified_report.py, path: src/cpal/challenge_verified_report.py}
              - {key: tokenreview_client.py, path: src/cpal/tokenreview_client.py}
              - {key: tokenreview_result.py, path: src/cpal/tokenreview_result.py}
        - name: verifier-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
        - name: kube-ca
          configMap:
            name: kube-root-ca.crt
        - name: tls
          secret:
            secretName: cpal-verifier-tls
            defaultMode: 0444
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cpal-verifier
  namespace: cpal-experiment
spec:
  type: ClusterIP
  selector:
    app: cpal-verifier
  ports:
    - name: https
      port: 8443
      targetPort: 8443
