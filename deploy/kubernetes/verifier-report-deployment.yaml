apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpal-verifier
  namespace: cpal-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cpal-verifier
  template:
    metadata:
      labels:
        app: cpal-verifier
    spec:
      serviceAccountName: cpal-token-verifier
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: python:3.12-slim
          command: [python, /opt/cpal/scripts/run_verifier.py]
          ports:
            - containerPort: 8443
          env:
            - name: PYTHONPATH
              value: /opt/cpal/src
            - name: CPAL_NAMESPACE
              value: cpal-experiment
            - name: CPAL_COLLECTOR_SERVICE_ACCOUNT
              value: cpal-collector
            - name: CPAL_COLLECTOR_UID
              valueFrom:
                configMapKeyRef:
                  name: cpal-verifier-runtime
                  key: collector_uid
            - name: CPAL_KUBERNETES_URL
              value: https://kubernetes.default.svc
            - name: CPAL_KUBERNETES_CA
              value: /etc/cpal/kube-ca/ca.crt
            - name: CPAL_VERIFIER_TOKEN_PATH
              value: /etc/cpal/token/token
            - name: CPAL_TLS_CERT
              value: /etc/cpal/tls/tls.crt
            - name: CPAL_TLS_KEY
              value: /etc/cpal/tls/tls.key
            - name: CPAL_CHALLENGE_DB
              value: /tmp/challenges.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /opt/cpal
              readOnly: true
            - name: verifier-token
              mountPath: /etc/cpal/token
              readOnly: true
            - name: kube-ca
              mountPath: /etc/cpal/kube-ca
              readOnly: true
            - name: tls
              mountPath: /etc/cpal/tls
              readOnly: true
            - name: state
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: cpal-verifier-code
        - name: verifier-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
                  audience: https://kubernetes.default.svc
        - name: kube-ca
          configMap:
            name: kube-root-ca.crt
        - name: tls
          secret:
            secretName: cpal-verifier-tls
            defaultMode: 0400
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cpal-verifier
  namespace: cpal-experiment
spec:
  type: ClusterIP
  selector:
    app: cpal-verifier
  ports:
    - name: https
      port: 8443
      targetPort: 8443
