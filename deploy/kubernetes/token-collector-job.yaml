apiVersion: batch/v1
kind: Job
metadata:
  name: cpal-token-check
  namespace: cpal-experiment
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: cpal-collector
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: token-check
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ['python', '-c']
          args:
            - |
              import json
              import os
              import ssl
              import urllib.error
              import urllib.request

              base = 'https://{}:{}'.format(os.environ['KUBERNETES_SERVICE_HOST'], os.environ['KUBERNETES_SERVICE_PORT'])
              with open('/var/run/secrets/cpal/token', encoding='utf-8') as f:
                  token = f.read().strip()
              context = ssl.create_default_context(cafile='/var/run/secrets/cpal/ca.crt')

              def check(path, expected, name):
                  request = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
                  try:
                      with urllib.request.urlopen(request, context=context, timeout=10) as response:
                          status = response.status
                          body = json.load(response)
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      body = json.load(exc)
                  if status != expected:
                      raise RuntimeError('{}: expected HTTP {}, observed HTTP {}: {}'.format(name, expected, status, body))
                  if status == 200 and body.get('metadata', {}).get('name') != name:
                      raise RuntimeError('{}: unexpected returned resource'.format(name))
                  print('{}: HTTP {}'.format(name, status), flush=True)

              prefix = '/api/v1/namespaces/cpal-experiment'
              check(prefix + '/pods/cpal-target', 200, 'cpal-target')
              check(prefix + '/serviceaccounts/cpal-target-sa', 200, 'cpal-target-sa')
              check(prefix + '/pods/other-pod', 403, 'other-pod')
              check(prefix + '/pods', 403, 'pod-list')
              print('Projected-token authentication and authorization controls passed', flush=True)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/cpal
              readOnly: true
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
