name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pip-audit bandit
      - name: Dependency audit
        run: python -m pip_audit
      - name: Static security analysis
        run: python -m bandit -r src scripts -ll
      - name: Release remains closed without approved evidence
        run: |
          if python scripts/check_release_gates.py; then
            echo 'Unexpected production release approval without evidence' >&2
            exit 1
          fi
