name: Kubernetes integration

on:
  push:
    branches: [main]
    paths:
      - 'deploy/kubernetes/**'
      - 'scripts/check_kubernetes_rbac.sh'
      - 'scripts/collect_kubernetes_identity.py'
      - 'src/cpal/kubernetes_*.py'
      - '.github/workflows/kubernetes-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: cpal-ci
      - name: Apply isolated fixtures and RBAC
        run: |
          kubectl apply -f deploy/kubernetes/collector-rbac.yaml
          kubectl apply -f deploy/kubernetes/target-fixture.yaml
          kubectl apply -f deploy/kubernetes/tokenreview-verifier-rbac.yaml
      - name: Assert allowed and denied RBAC operations
        run: bash scripts/check_kubernetes_rbac.sh
      - name: Collect Kubernetes identity from real API server
        run: |
          python -m pip install -e . kubernetes
          PYTHONPATH=src python scripts/collect_kubernetes_identity.py --namespace cpal-experiment --pod cpal-target

      - name: Verify projected token from inside disposable cluster
        run: |
          kubectl apply -f deploy/kubernetes/token-collector-job.yaml
          kubectl wait -n cpal-experiment --for=condition=complete job/cpal-token-check --timeout=180s || {
            kubectl describe -n cpal-experiment job/cpal-token-check
            kubectl get -n cpal-experiment pods -l job-name=cpal-token-check -o wide
            kubectl logs -n cpal-experiment job/cpal-token-check --all-containers=true || true
            exit 1
          }
          kubectl logs -n cpal-experiment job/cpal-token-check

      - name: Assert TokenReview privilege isolation
        run: |
          kubectl auth can-i create tokenreviews.authentication.k8s.io --as=system:serviceaccount:cpal-experiment:cpal-token-verifier | grep -x yes
          kubectl auth can-i create tokenreviews.authentication.k8s.io --as=system:serviceaccount:cpal-experiment:cpal-collector | grep -x no
          kubectl auth can-i get secrets -n cpal-experiment --as=system:serviceaccount:cpal-experiment:cpal-token-verifier | grep -x no

      - name: Verify live collector TokenReview
        run: |
          set -euo pipefail
          TOKEN="$(kubectl -n cpal-experiment create token cpal-collector --audience=cpal-collector-verification --duration=10m)"
          kubectl -n cpal-experiment create secret generic cpal-ci-collector-token --from-literal=token="$TOKEN"
          unset TOKEN
          kubectl apply -f deploy/kubernetes/tokenreview-live-job.yaml
          kubectl wait -n cpal-experiment --for=condition=complete job/cpal-tokenreview-check --timeout=180s || {
            kubectl describe -n cpal-experiment job/cpal-tokenreview-check
            kubectl logs -n cpal-experiment job/cpal-tokenreview-check || true
            exit 1
          }
          kubectl logs -n cpal-experiment job/cpal-tokenreview-check
          kubectl -n cpal-experiment delete secret cpal-ci-collector-token
