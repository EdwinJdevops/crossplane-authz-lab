name: DynamoDB Local integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dynamodb-local:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . boto3
      - name: Create disposable local table and execute live protocol probe
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-east-1
          CPAL_DYNAMODB_CHALLENGE_TABLE: cpal-ci-ledger
        run: |
          python - <<'PY'
          import boto3
          client = boto3.client('dynamodb', endpoint_url='http://localhost:8000')
          client.create_table(TableName='cpal-ci-ledger', KeySchema=[{'AttributeName':'nonce','KeyType':'HASH'}], AttributeDefinitions=[{'AttributeName':'nonce','AttributeType':'S'}], BillingMode='PAY_PER_REQUEST')
          client.get_waiter('table_exists').wait(TableName='cpal-ci-ledger')
          PY
          CPAL_DYNAMODB_ENDPOINT_URL=http://localhost:8000 python scripts/dynamodb_live_probe.py
