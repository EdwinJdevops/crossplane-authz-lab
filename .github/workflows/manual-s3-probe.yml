name: Manual S3 Role Probe
on:
  workflow_dispatch:
    inputs:
      role_arn:
        description: 'Disposable restricted role ARN to assume'
        required: true
        type: string
      bucket:
        description: 'Disposable private S3 bucket name'
        required: true
        type: string
      key:
        description: 'Existing harmless S3 object key'
        required: true
        type: string
      region:
        description: 'AWS region'
        required: true
        default: us-east-1
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: aws-experiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AWS SDK
        run: python -m pip install 'boto3>=1.34,<2' 'botocore>=1.34,<2'
      - name: Configure short-lived OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CPAL_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - name: Probe restricted role session
        env:
          TARGET_ROLE: ${{ inputs.role_arn }}
          TARGET_BUCKET: ${{ inputs.bucket }}
          TARGET_KEY: ${{ inputs.key }}
          TARGET_REGION: ${{ inputs.region }}
        run: |
          python scripts/verify_effective_s3_role.py \
            --role-arn "$TARGET_ROLE" --bucket "$TARGET_BUCKET" \
            --key "$TARGET_KEY" --region "$TARGET_REGION"
